<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Muncie Kombat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muncie Kombat">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/metal-mania.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/anton.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Metal Mania'; src: url('fonts/metal-mania.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Nosifer'; src: url('fonts/nosifer.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%;
    position: fixed; inset: 0; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #controls { position: absolute; inset: 0; pointer-events: none; display: none; }
  #controls.on { display: block; }
  .btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 400 15px/1 Anton, Impact, "Arial Black", sans-serif; letter-spacing: 1px; color: #fff; font-style: italic;
    text-shadow: 2px 2px 0 #000; border: 3px solid rgba(0,0,0,0.75); box-sizing: border-box;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.3); opacity: 0.66; }
  .btn.down { opacity: 0.95; transform: scale(0.92); box-shadow: inset 3px 4px 0 rgba(0,0,0,0.4); }
  #bPunch { width: 100px; height: 100px; background: radial-gradient(circle at 35% 30%, #ff7a6a, #c8141c 55%, #6a0608); font-size: 18px; }
  #bKick  { width: 84px; height: 84px; background: radial-gradient(circle at 35% 30%, #7aa8ff, #2a52b9 55%, #10246a); font-size: 17px; }
  #bBlock { width: 78px; height: 78px; background: radial-gradient(circle at 35% 30%, #ffe27a, #d89818 55%, #7a4a08); }
  #stickBase { position: absolute; width: 124px; height: 124px; border-radius: 50%; margin: -62px 0 0 -62px;
    background: rgba(255,255,255,0.08); border: 3px solid rgba(255,255,255,0.3); box-sizing: border-box; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(240,230,230,0.5); border: 3px solid rgba(0,0,0,0.6); box-sizing: border-box; }
  #pauseBtn { position: absolute; bottom: calc(6px + env(safe-area-inset-bottom)); left: 50%; margin-left: -40px; width: 80px; height: 30px;
    display: none; border: 2px solid rgba(0,0,0,0.75); border-radius: 15px; background: linear-gradient(#8a1a1a, #5a0a0a 55%, #2a0404); color: #ffe0a0;
    font: 400 13px/26px Anton, Impact, sans-serif; font-style: italic; letter-spacing: 1px; text-shadow: 1px 1px 0 #000; text-align: center; padding: 0; z-index: 5; opacity: 0.8;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  #pauseBtn.on { display: block; }
  #rotate { position: absolute; inset: 0; background: #140204; color: #fff; display: none; z-index: 20;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font: 900 20px/1.4 "Arial Black", system-ui, sans-serif; padding: 30px; box-sizing: border-box; }
  #rotate .phone { width: 46px; height: 80px; border: 5px solid #d8261c; border-radius: 9px; margin-bottom: 26px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div class="btn" id="bBlock">BLOCK</div>
  <div class="btn" id="bKick">KICK</div>
  <div class="btn" id="bPunch">PUNCH</div>
</div>
<button id="pauseBtn" aria-label="Pause">II PAUSE</button>
<div id="rotate"><div class="phone"></div>TURN YOUR PHONE SIDEWAYS<br><span style="font-size:14px;color:#d8261c">MUNCIE KOMBAT PLAYS IN LANDSCAPE</span></div>

</body>
</html>
